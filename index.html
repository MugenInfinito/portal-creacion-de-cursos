<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Portal Reto 2 Grupo Retorna</title>
<style>
:root{
  --bg:#f6f7f4; --surface:#ffffff; --surface-2:#eef2ec; --line:#dde3da;
  --ink:#1c2620; --ink-2:#4a5a50; --ink-3:#7a887f;
  --brand:#1f6f50; --brand-2:#2f8f68; --brand-soft:#e3f1ea; --accent:#c9822b;
  --danger:#b3412f; --focus:#2f8f68;
  --radius:12px; --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 24px rgba(20,40,30,.06);
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --on-brand:#ffffff; --mark:#f6df9f;
  --t-pend-bg:#fbecd6; --t-pend-fg:#8a5413; --t-sup-bg:#f3e6f6; --t-sup-fg:#7a3f8a;
  --t-ref-bg:#e3ecf8; --t-ref-fg:#2f5a8f; --t-dato-bg:#e6f2e2; --t-dato-fg:#3c6b2b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#18201c; --surface-2:#1f2924; --line:#2c3832;
    --ink:#e7eee9; --ink-2:#b5c3ba; --ink-3:#8a998f;
    --brand:#5cc49a; --brand-2:#79d3ad; --brand-soft:#1d3329; --accent:#e0a45c;
    --danger:#ef7d68; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
    --on-brand:#0e1a14; --mark:#6b5520;
    --t-pend-bg:#3a2c18; --t-pend-fg:#e8b675; --t-sup-bg:#33233a; --t-sup-fg:#d3a6e0;
    --t-ref-bg:#1f2c3d; --t-ref-fg:#9fc0ea; --t-dato-bg:#1f3122; --t-dato-fg:#a6d39a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#121815; --surface:#18201c; --surface-2:#1f2924; --line:#2c3832;
    --ink:#e7eee9; --ink-2:#b5c3ba; --ink-3:#8a998f;
    --brand:#5cc49a; --brand-2:#79d3ad; --brand-soft:#1d3329; --accent:#e0a45c;
    --danger:#ef7d68; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
    --on-brand:#0e1a14; --mark:#6b5520;
    --t-pend-bg:#3a2c18; --t-pend-fg:#e8b675; --t-sup-bg:#33233a; --t-sup-fg:#d3a6e0;
    --t-ref-bg:#1f2c3d; --t-ref-fg:#9fc0ea; --t-dato-bg:#1f3122; --t-dato-fg:#a6d39a;
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:var(--brand)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px}
.mark{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mark svg{width:44px;height:44px;flex:none}
.mark .t1{font-weight:700;font-size:18px;letter-spacing:.2px}
.mark .t2{font-size:13px;color:var(--ink-3)}
.login-card h1{font-size:22px;margin:4px 0 6px}
.login-card p{margin:0 0 20px;color:var(--ink-2);font-size:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
.field{position:relative}
input[type=text],input[type=password],input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);cursor:pointer;padding:6px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--brand);color:var(--on-brand);width:100%;margin-top:22px}
.btn-primary[disabled]{opacity:.7;cursor:progress}
.err{color:var(--danger);font-size:14px;margin-top:12px;min-height:20px}
.fine{margin-top:18px;font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start}
.fine svg{flex:none;width:16px;height:16px;margin-top:2px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .mark{margin:0;gap:10px;cursor:pointer}
.topbar .mark svg{width:32px;height:32px}
.topbar .mark .t1{font-size:15px}
.topbar .mark .t2{font-size:12px}
.spacer{flex:1}
.search{position:relative;width:min(360px,40vw)}
.search input{padding-left:36px;background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.who{font-size:13px;color:var(--ink-2);white-space:nowrap}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);padding:7px 12px;font-size:13px}
.btn-ghost:hover{background:var(--surface-2)}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 57px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 40px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side .home-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.side .home-link svg{width:18px;height:18px;color:var(--brand);flex:none}
.side .home-link:hover,.side .home-link.on{background:var(--brand-soft);color:var(--brand)}
.grp{margin-top:6px}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;color:var(--ink);font-weight:600;font-size:14px;text-align:left;cursor:pointer;border-radius:8px}
.grp-h:hover{background:var(--surface-2)}
.grp-h svg.ic{width:18px;height:18px;color:var(--brand);flex:none}
.grp-h .chev{margin-left:auto;width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
.grp.open .chev{transform:rotate(90deg)}
.grp ul{list-style:none;margin:2px 0 6px;padding:0 0 0 18px;display:none;border-left:1px solid var(--line);margin-left:19px}
.grp.open ul{display:block}
.grp li a{display:block;padding:5px 10px;font-size:13.5px;color:var(--ink-2);text-decoration:none;border-radius:6px;line-height:1.35}
.grp li a:hover{background:var(--surface-2);color:var(--ink)}
.grp li a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}

main{min-width:0;padding:28px 40px 80px}
.wrap{max-width:900px;margin:0 auto}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--brand)}
h1.ptitle{font-size:30px;line-height:1.2;margin:0 0 18px;letter-spacing:-.2px}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:0 0 24px;font-size:14px}
.toc b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin-bottom:6px}
.toc a{display:inline-block;margin:2px 14px 2px 0;text-decoration:none}

/* contenido */
.content h2{font-size:22px;margin:32px 0 10px}
.content h3{font-size:19px;margin:30px 0 10px;padding-top:6px;scroll-margin-top:80px}
.content h4{font-size:16px;margin:22px 0 8px}
.content p{margin:0 0 14px}
.content ul,.content ol{padding-left:22px;margin:0 0 14px}
.content li{margin:4px 0}
.content strong{color:var(--ink)}
.tbl{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:13px;color:var(--ink-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td{min-width:90px}
blockquote.note{margin:0 0 20px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 var(--radius) var(--radius) 0}
blockquote.note p{margin:0}
code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:.9em}
pre{overflow:auto}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0 22px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.fnode{flex:1 1 150px;max-width:220px;background:var(--brand-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.fnode b{font-size:14px;line-height:1.3;color:var(--ink)}
.fnode small{font-size:12px;color:var(--ink-2);line-height:1.35}
.fnum{font-size:11px;font-weight:700;color:var(--brand)}
.farrow{align-self:center;color:var(--brand);font-weight:700}
.fnotes{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.fnotes li{margin:3px 0}
@media (max-width:600px){.farrow{transform:rotate(90deg);width:100%;text-align:center}.fnode{max-width:none}}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
.tag-propuesta{background:var(--brand-soft);color:var(--brand)}
.tag-pendiente-de-validacion,.tag-pendiente{background:var(--t-pend-bg);color:var(--t-pend-fg)}
.tag-supuesto{background:var(--t-sup-bg);color:var(--t-sup-fg)}
.tag-referente-externo{background:var(--t-ref-bg);color:var(--t-ref-fg)}
.tag-dato-conocido{background:var(--t-dato-bg);color:var(--t-dato-fg)}

.pager{display:flex;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.pager a{flex:1;display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;background:var(--surface)}
.pager a:hover{border-color:var(--brand-2)}
.pager small{display:block;color:var(--ink-3);font-size:12px}
.pager span{color:var(--ink);font-weight:600;font-size:14px}
.pager .next{text-align:right}
.tools{display:flex;gap:8px;margin:-6px 0 18px}

/* inicio */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:24px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:28px;line-height:1.2}
.hero p{margin:0;color:var(--ink-2);max-width:640px}
.hero .cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.hero .cta a{text-decoration:none}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.card .ci{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.card .ci svg{width:20px;height:20px}
.card b{font-size:15.5px}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.card small{margin-top:auto;color:var(--ink-3);font-size:12px}
.sec-h{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);margin:28px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink-2)}

/* resultados de búsqueda */
.res{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;text-decoration:none;color:var(--ink)}
.res:hover{border-color:var(--brand-2)}
.res small{color:var(--ink-3)}
.res p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

/* botones de navegación (sin enlaces) */
#app button.home-link,#app .grp li button,#app .crumbs button,#app .toc button,#app button.card,#app button.res,#app .pager button{
  appearance:none;-webkit-appearance:none;font:inherit;border:0;background:none;cursor:pointer;text-align:left;width:auto}
#app button.home-link{width:100%;font-weight:600;font-size:14px;color:var(--ink)}
#app button.home-link:hover,#app button.home-link.on{background:var(--brand-soft);color:var(--brand)}
#app .grp li button{display:block;width:100%;padding:5px 10px;font-size:13.5px;color:var(--ink-2);border-radius:6px;line-height:1.35}
#app .grp li button:hover{background:var(--surface-2);color:var(--ink)}
#app .grp li button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
#app .crumbs button{color:var(--ink-3);font-size:13px;padding:0}
.crumbs button:hover{color:var(--brand);text-decoration:underline}
#app .toc button{display:inline-block;margin:2px 14px 2px 0;color:var(--brand);font-size:14px;padding:0}
.toc button:hover{text-decoration:underline}
#app button.card{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#app button.res{display:block;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.res b{display:block;margin-top:2px}
#app .pager button{flex:1;display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
#app .pager button:hover{border-color:var(--brand-2)}
#app .pager button.next{text-align:right}
.tools{align-items:center;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.on{background:var(--brand);width:22px;border-radius:5px}
.dot:hover{background:var(--brand-2)}

/* ---------- constructor interactivo ---------- */
.wrap.wide{max-width:1080px}
.bld{display:flex;flex-direction:column;gap:16px}
.bld .crumbs{margin:0}
.bld-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.bld-title{min-width:0;flex:1 1 320px}
.bld-title .ptitle{margin:0 0 4px;text-wrap:balance}
.bld-sub{font-size:13px;color:var(--ink-3)}
.pbar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:8px;overflow:hidden;max-width:360px}
.pbar span{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.bld-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:12px;color:var(--ink-3);margin-right:4px}
.saved .ko,.kot{color:var(--danger)}
.okt{color:var(--brand)}
.toast{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.exb{background:var(--t-pend-bg);color:var(--t-pend-fg);border-radius:10px;padding:10px 14px;font-size:14px}

.stepper{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
#app .stp{appearance:none;flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px 6px 6px;font:inherit;font-size:13px;cursor:pointer;position:relative}
#app .stp:hover{border-color:var(--brand-2)}
.stp .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.stp.done .sn{background:var(--brand-soft);color:var(--brand)}
#app .stp.cur{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.stp.cur .sn{background:var(--on-brand);color:var(--brand)}
.stp .sb{min-width:18px;height:18px;border-radius:9px;background:var(--t-pend-bg);color:var(--t-pend-fg);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.bld-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-width:0}
.step-h{margin-bottom:18px}
.step-n{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand);font-weight:700}
.step-h h2{margin:2px 0 4px;font-size:24px}
.step-h p{margin:0;color:var(--ink-2)}
.bld-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bld-nav .btn{padding:12px 18px}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:0 0 6px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide,.chips.wide{grid-column:1/-1}
.fld label,.fld .lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin:0}
.fld small{font-size:12px;color:var(--ink-3);line-height:1.4}
.req{color:var(--danger)}
.bld input[type=text],.bld input[type=number],.bld select,.bld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.bld textarea{resize:vertical;min-height:64px;line-height:1.45}
.bld input:focus,.bld select:focus,.bld textarea:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.bld input[type=range]{width:100%;accent-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
#app .seg button{appearance:none;border:0;background:var(--bg);color:var(--ink-2);padding:8px 18px;font:inherit;font-size:14px;cursor:pointer}
#app .seg button+button{border-left:1px solid var(--line)}
#app .seg button.on{background:var(--brand);color:var(--on-brand);font-weight:600}
.qlist{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.qlist .fld{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.qlist .fld .lbl{flex:1 1 300px;font-size:14px;color:var(--ink)}
.qlist .fld small{flex-basis:100%}
.sub{font-size:17px;margin:26px 0 6px}
.sub.first{margin-top:0}
.sub .count{font-size:12px;background:var(--surface-2);border-radius:9px;padding:1px 8px;vertical-align:2px;color:var(--ink-2)}
.hint{color:var(--ink-2);font-size:14px;margin:0 0 12px}
.tipbox{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink-2);margin:10px 0}
.decision{border-radius:12px;padding:12px 16px;margin:4px 0 16px;border:1px solid var(--line)}
.decision p{margin:4px 0 0;font-size:14px}
.decision.pend{color:var(--ink-3);font-size:14px}
.decision.d-si{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.decision.d-parcial{background:var(--t-pend-bg);border-color:transparent;color:var(--t-pend-fg)}
.decision.d-no{background:var(--surface-2);border-color:var(--danger);color:var(--danger)}
.prio{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px}
.prio .w{font-weight:400;color:var(--ink-3);font-size:12px}
.score{display:flex;align-items:baseline;gap:10px;margin:8px 0 14px;color:var(--ink-2)}
.score .big,.big{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:600;margin-left:6px}

.icard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;background:var(--bg)}
.ic-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.ic-h .muted{flex:1;font-size:13px;min-width:0}
.muted{color:var(--ink-3)}
#app .lnk{appearance:none;border:0;background:none;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;padding:2px 0;text-align:left}
#app .lnk:hover{text-decoration:underline}
#app .lnk.del{color:var(--ink-3)}
#app .lnk.del.ask{color:var(--danger);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips>span{font-size:12px;color:var(--ink-3);margin-right:2px}
#app .chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
#app .chip:hover{border-color:var(--brand-2);color:var(--brand)}
#app .chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.addbtn{margin:0 0 16px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--ink-3);font-size:14px;margin-bottom:14px;text-align:center}
.preview{background:var(--surface);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:12px}
.preview .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);font-weight:700}
.preview p{margin:2px 0 4px}
.preview small{color:var(--ink-3)}
.fb{font-size:13px;margin-top:8px;padding:7px 10px;border-radius:8px}
.fb.ko{background:var(--t-pend-bg);color:var(--danger);font-weight:600}
.fb.w{background:var(--t-pend-bg);color:var(--t-pend-fg)}
.fb.ok{background:var(--brand-soft);color:var(--brand)}
.fb.info{background:var(--surface-2);color:var(--ink-2)}
.cov,.flags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.flags{margin:8px 0 0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.ko{background:var(--t-pend-bg);color:var(--t-pend-fg)}
.sess{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;background:var(--bg)}
.sess-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:8px}
.sess-h .fld{flex:1}
.sbadge{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;flex:none}
.smin{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-bottom:10px}
.sess select{padding:5px 8px;font-size:13px}
.warnbox{border-color:var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pesobar{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.pb{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.pb span{display:block;height:100%;background:var(--accent);border-radius:6px}
.pb span.ok{background:var(--brand)}
.pb span.ko{background:var(--danger)}

.iss{margin-top:20px;border-radius:12px;padding:12px 16px;background:var(--surface-2);font-size:14px}
.iss.ok{background:var(--brand-soft);color:var(--brand)}
.iss ul{margin:6px 0;padding-left:20px}
.iss ul.m li::marker{color:var(--danger)}
.iss ul.w{color:var(--ink-2)}
.iss small{color:var(--ink-3)}

.clist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.clist-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.crow.cur b{color:var(--brand)}
.crow small{color:var(--ink-3)}
.crow-b{display:flex;gap:12px;align-items:center}
.clist-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.clist-f small{color:var(--ink-3);flex:1 1 240px}
.filebtn{cursor:pointer}

.res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}
.res-tabs{display:flex;gap:4px;flex-wrap:wrap}
#app .res-tabs button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
#app .res-tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.res-btns{display:flex;gap:8px;flex-wrap:wrap}
.resdoc h3{font-size:20px;margin:6px 0 12px}
.resdoc h4{font-size:15px;margin:20px 0 6px;color:var(--brand)}
.resdoc p{margin:0 0 10px}
.resdoc ol,.resdoc ul{margin:0 0 10px;padding-left:22px}
.resdoc th{width:auto}
.resdoc .tbl table tbody th{width:28%;background:var(--surface-2);position:static}
.mx td{min-width:120px;font-size:13.5px}
.pend{color:var(--t-pend-fg);font-style:italic}
.state{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:999px}
.s-completo{background:var(--brand-soft);color:var(--brand)}
.s-incompleto{background:var(--t-pend-bg);color:var(--t-pend-fg)}
.s-incoherente{background:var(--t-pend-bg);color:var(--danger)}
.status{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;border-radius:14px;padding:14px 18px;margin-bottom:18px}
.status p{margin:2px 0 0;font-size:14px}
.status.ready{background:var(--brand-soft);color:var(--brand)}
.status.draft{background:var(--t-pend-bg);color:var(--t-pend-fg)}
.status .todo{display:flex;flex-direction:column;gap:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:0 0 8px}
.facts div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.facts small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.sesdoc{margin-bottom:18px}
.sesdoc h4 small{font-weight:400;color:var(--ink-3);margin-left:6px}
.cklist{list-style:none;padding:0;margin:0}
.cklist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cklist li>span:nth-child(2){flex:1 1 260px}
.ckm{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.cklist .ok .ckm{background:var(--brand-soft);color:var(--brand)}
.cklist .ko .ckm{background:var(--t-pend-bg);color:var(--danger)}
.cklist .pendi{color:var(--ink-3)}
.cklist .pendi .ckm{background:var(--surface-2)}

.bld-cta{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--brand);color:var(--on-brand);border-radius:16px;padding:18px 22px;margin:0 0 20px}
.bld-cta b{font-size:17px;display:block}
.bld-cta p{margin:2px 0 0;font-size:14px;opacity:.9;max-width:560px}
#app .bld-cta button{appearance:none;border:0;background:var(--on-brand);color:var(--brand);font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer}

@media (max-width:700px){
  .fgrid{grid-template-columns:1fr}
  .bld-panel{padding:16px 14px}
  .step-h h2{font-size:20px}
  .stp .st{display:none}
  .stp.cur .st{display:inline}
  .bld-nav .btn{flex:1}
  .sess-h{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){.pbar span{transition:none}}

/* móvil */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:57px;width:min(320px,88vw);z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body.nav-open nav.side{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:20px 16px 60px}
  .search{width:auto;flex:1}
  .spacer{display:none}
  .topbar .mark .txt,.who{display:none}
  h1.ptitle{font-size:24px}
}
@media print{
  .topbar,nav.side,.pager,.tools,.toc{display:none!important}
  .layout{display:block} main{padding:0}
  .tbl{overflow:visible;border:0} th{position:static}
}
</style>
</head>

const enc = new TextEncoder(), dec = new TextDecoder();
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);

/* ---------------- ingreso ---------------- */
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:P.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function userId(name){
  const s = ub(P.usalt), n = enc.encode(name), b = new Uint8Array(s.length + n.length);
  b.set(s); b.set(n, s.length);
  return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest("SHA-256", b))));
}
async function unlock(user, pw){
  const id = await userId(user.trim().toLowerCase());
  const entry = P.users.find(u => u.id === id);
  const target = entry || P.users[0];           // mismo tiempo de espera exista o no el usuario
  const k = await deriveKey(pw, ub(target.salt));
  if(!entry) throw new Error("bad");
  const raw = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(entry.iv)}, k, ub(entry.k));
  const ck = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const data = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(P.iv)}, ck, ub(P.data));
  const name = dec.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(entry.niv)}, ck, ub(entry.nm)));
  return {doc: JSON.parse(dec.decode(data)), name};
}

let fails = 0;
const cleanPw = s => s.normalize("NFC").replace(/[\u2010-\u2015\u2212]/g,"-").replace(/[`"'\u201c\u201d]/g,"").trim();
async function doLogin(){
  const err = $("err");
  if(!window.crypto || !crypto.subtle){
    err.textContent = "Este visor no permite abrir el portal. Descargue el archivo y ábralo con doble clic en Chrome, Edge, Firefox o Safari."; return;
  }
  const user = $("u").value.trim(), pw = cleanPw($("p").value);
  if(!user || !pw){ err.textContent = "Escriba usuario y contraseña."; return; }
  const go = $("go"); go.disabled = true; go.textContent = "Verificando… (puede tardar unos segundos)"; err.textContent = "";
  try{
    const r = await unlock(user, pw);
    $("p").value = ""; fails = 0;
    if(r.doc.app){ const s = document.createElement("script"); s.textContent = r.doc.app; document.body.appendChild(s); delete r.doc.app; }
    start(r.doc, r.name);
  }catch(e){
    fails++;
    err.textContent = (e && e.message === "bad") || (e && e.name === "OperationError")
      ? "Usuario o contraseña incorrectos. Revise mayúsculas y guiones."
      : "No se pudo abrir el portal en este navegador (" + (e && (e.name || e.message)) + "). Pruebe con Chrome o Edge.";
    await new Promise(r => setTimeout(r, Math.min(8000, 400 * 2 ** fails)));
  }finally{ go.disabled = false; go.textContent = "Ingresar"; }
}
$("go").addEventListener("click", doLogin);
$("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });

let DOC, FLAT = [], BYSLUG = {}, IDLE, CUR = {v:"home"};

function start(doc, name){
  DOC = doc;
  doc.groups.forEach((g, gi) => g.pages.forEach((p, pi) => {
    p.gi = gi; p.pi = pi; p.text = textOf(p.html);
    FLAT.push(p); BYSLUG[p.slug] = p;
  }));
  $("who").textContent = name;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  renderNav(); show({v:"home"}, false);
  try{ history.replaceState({v:"home"}, ""); }catch(_){}
  addEventListener("popstate", e => { if(e.state && e.state.v) show(e.state, false); });
  ["click","keydown","scroll","mousemove","touchstart"].forEach(ev => addEventListener(ev, bump, {passive:true}));
  bump();
}
function textOf(h){ const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g," "); }
function lock(){ DOC = null; $("view").innerHTML = ""; $("side").innerHTML = ""; location.reload(); }
function bump(){ clearTimeout(IDLE); IDLE = setTimeout(lock, 30*60*1000); }
$("lock").onclick = lock;
$("homeMark").onclick = () => show({v:"home"});

/* navegación interna: todo ocurre dentro de la misma página, sin enlaces */
function show(state, push = true){
  CUR = state;
  if(push){ try{ history.pushState(state, ""); }catch(_){} }
  document.body.classList.remove("nav-open");
  $("view").classList.toggle("wide", state.v === "builder");
  if(state.v === "builder") return BLD.render(state.s);
  if(state.v === "page") return showPage(state.s);
  if(state.v === "search") return showSearch(state.q);
  showHome();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go],[data-home],[data-to],[data-builder]");
  if(b){
    e.preventDefault();
    if(b.dataset.to){ const t = $(b.dataset.to); if(t) t.scrollIntoView({behavior:"smooth"}); return; }
    if(b.hasAttribute("data-home")) return show({v:"home"});
    if(b.hasAttribute("data-builder")) return show({v:"builder"});
    return show({v:"page", s:b.dataset.go});
  }
  const a = e.target.closest("#view a[href]");
  if(a){
    const href = a.getAttribute("href");
    if(href.startsWith("#")){ e.preventDefault(); return; }       // anclas internas: no salir de la vista
    a.target = "_blank"; a.rel = "noopener noreferrer";             // fuentes externas: pestaña aparte
  }
});

function renderNav(){
  let h = `<button class="home-link" type="button" data-home>${icon("compass")}Inicio</button><button class="home-link" type="button" data-builder>${icon("form")}Crear un curso</button>`;
  DOC.groups.forEach((g, gi) => {
    h += `<div class="grp" data-g="${gi}"><button class="grp-h" type="button" aria-expanded="false">${icon(g.icon)}<span>${esc(g.name)}</span>${chev}</button><ul>`;
    g.pages.forEach(p => { h += `<li><button type="button" class="nl" data-go="${p.slug}">${esc(p.short)}</button></li>`; });
    h += `</ul></div>`;
  });
  $("side").innerHTML = h;
  $("side").querySelectorAll(".grp-h").forEach(b => b.onclick = () => {
    const o = b.parentElement.classList.toggle("open"); b.setAttribute("aria-expanded", o);
  });
}
function markNav(slug){
  $("side").querySelectorAll(".on").forEach(a => a.classList.remove("on"));
  if(slug === "__builder"){ $("side").querySelector("[data-builder]").classList.add("on"); return; }
  if(!slug){ $("side").querySelector("[data-home]").classList.add("on"); return; }
  const a = $("side").querySelector(`[data-go="${slug}"]`);
  if(a){ a.classList.add("on"); const gr = a.closest(".grp"); $("side").querySelectorAll(".grp.open").forEach(x => { if(x !== gr) x.classList.remove("open"); }); gr.classList.add("open"); a.scrollIntoView({block:"nearest"}); }
}

    <span><span class="tag tag-pendiente-de-validacion">PENDIENTE DE VALIDACIÓN</span> decisión que debe tomar Grupo Retorna</span>
    <span><span class="tag tag-supuesto">SUPUESTO</span> condición asumida, por confirmar</span>
    <span><span class="tag tag-dato-conocido">DATO CONOCIDO</span> información confirmada</span></div>`;
  $("view").innerHTML = h; scrollTo(0,0); document.title = "Inicio · Reto 2 · Grupo Retorna";
}

function showPage(slug){
  const p = BYSLUG[slug]; if(!p) return showHome();
  markNav(slug);
  const g = DOC.groups[p.gi], i = FLAT.indexOf(p), prev = FLAT[i-1], next = FLAT[i+1];
  const tmp = document.createElement("div"); tmp.innerHTML = p.html;
  const hs = [...tmp.querySelectorAll("h3")];
  hs.forEach((x, k) => x.id = "s" + k);
  const toc = hs.length >= 3 ? `<div class="toc"><b>En esta página</b>${hs.map((x,k)=>`<button type="button" data-to="s${k}">${esc(x.textContent)}</button>`).join("")}</div>` : "";
  const dots = g.pages.map(x => `<button type="button" class="dot${x===p?" on":""}" data-go="${x.slug}" title="${esc(x.short)}" aria-label="${esc(x.short)}"></button>`).join("");
  $("view").innerHTML =
    `<div class="crumbs"><button type="button" data-home>Inicio</button> › <button type="button" data-go="${g.pages[0].slug}">${esc(g.name)}</button> · ${p.pi+1} de ${g.pages.length}</div>
     <h1 class="ptitle">${esc(p.title)}</h1>
     <div class="tools"><button type="button" class="btn btn-ghost" id="printBtn">Imprimir esta página</button><div class="dots">${dots}</div></div>
     ${toc}<div class="content">${tmp.innerHTML}</div>
     <div class="pager">${prev?`<button type="button" data-go="${prev.slug}"><small>← Anterior</small><span>${esc(prev.short)}</span></button>`:"<span style='flex:1'></span>"}
     ${next?`<button type="button" class="next" data-go="${next.slug}"><small>Siguiente →</small><span>${esc(next.short)}</span></button>`:"<span style='flex:1'></span>"}</div>`;
  $("printBtn").onclick = () => window.print();
  document.title = p.short + " · Reto 2";
  scrollTo(0,0);
}

/* búsqueda */
let QT;
$("q").addEventListener("input", e => {
  clearTimeout(QT);
  const v = e.target.value.trim();
  QT = setTimeout(() => {
    if(v.length >= 2){ CUR.v === "search" ? (CUR.q = v, showSearch(v)) : show({v:"search", q:v}); }
    else if(CUR.v === "search") show({v:"home"});
  }, 250);
});
$("q").addEventListener("keydown", e => { if(e.key === "Escape"){ e.target.value = ""; show({v:"home"}); } });
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function showSearch(q){
  markNav(null);
  if($("q").value.trim() !== q) $("q").value = q;
  const words = norm(q).split(/\s+/).filter(Boolean);
  const hits = FLAT.map(p => {
    const nt = norm(p.text), tt = norm(p.short + " " + p.title);
    if(!words.every(w => nt.includes(w) || tt.includes(w))) return null;
    const score = words.reduce((s,w) => s + (tt.includes(w)?10:0) + (nt.split(w).length-1), 0);
    const at = Math.max(0, nt.indexOf(words[0]));
    return {p, score, snip: p.text.slice(Math.max(0, at-80), at+160)};
  }).filter(Boolean).sort((a,b) => b.score - a.score);
  const re = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "gi");
  const hl = s => esc(s).replace(re, "<mark>$1</mark>");
  let h = `<div class="crumbs"><button type="button" data-home>Inicio</button> › Búsqueda</div><h1 class="ptitle">${hits.length} resultado${hits.length===1?"":"s"} para “${esc(q)}”</h1>`;
  if(!hits.length) h += `<p>No se encontraron coincidencias. Pruebe con otra palabra, por ejemplo “rúbrica”, “piloto” o “certificado”.</p>`;
  hits.slice(0,40).forEach(({p, snip}) => {
    h += `<button type="button" class="res" data-go="${p.slug}"><small>${esc(DOC.groups[p.gi].name)}</small><b>${hl(p.short)}</b><p>…${hl(snip)}…</p></button>`;
  });
  $("view").innerHTML = h; scrollTo(0,0);
}
</script>
